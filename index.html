<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101a2a">
<title>星际守望 · 塔防</title>
<style>
:root{color-scheme:dark;--bg:#0d1625;--panel:#152338;--line:#293e59;--mint:#71f0c1;--gold:#ffc66d;--text:#e8f1ff;--muted:#91a4bd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1d3451 0,#0d1625 65%);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}.app{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:22px;font-weight:800;letter-spacing:.04em}.brand span{color:var(--mint)}.subtitle{color:var(--muted);font-size:13px;margin-top:4px}.stats{display:flex;gap:10px}.stat{background:#142238;border:1px solid var(--line);border-radius:12px;padding:10px 15px;min-width:88px}.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 275px;gap:16px}.board,.side{background:linear-gradient(145deg,#16263b,#111d2e);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px #03081280}.board{padding:12px;position:relative;min-width:0}canvas{width:100%;height:auto;display:block;border-radius:12px;touch-action:manipulation}.overlay{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;pointer-events:none}.banner{background:#0b1424dc;border:1px solid #375170;border-radius:16px;padding:18px 24px;text-align:center;box-shadow:0 10px 35px #0008;max-width:85%}.banner strong{display:block;font-size:22px;margin-bottom:6px}.banner span{color:#b4c5d9;font-size:13px}.side{padding:18px}.side h2{font-size:15px;margin:0 0 12px}.tower{width:100%;display:flex;align-items:center;gap:11px;text-align:left;padding:11px;background:#1b2c43;border:1px solid #30455e;border-radius:12px;color:var(--text);margin:8px 0;cursor:pointer;transition:.15s}.tower:hover,.tower.active{border-color:var(--mint);background:#1c3946}.icon{font-size:23px;width:35px;text-align:center}.tower b{display:block;font-size:13px}.tower small{color:var(--muted)}button{font:inherit}.actions{display:grid;gap:9px;margin-top:16px}.action{border:0;border-radius:11px;padding:12px;font-weight:750;cursor:pointer;background:var(--mint);color:#10251f}.action.secondary{background:#263a54;color:var(--text);border:1px solid #3a526f}.action.danger{background:#552f3a;color:#ffd9df;border:1px solid #814552}.action:disabled{opacity:.45;cursor:not-allowed}.help{color:var(--muted);font-size:12px;line-height:1.65;margin-top:15px}.selection{padding:11px;background:#102035;border-radius:10px;color:#c5d4e8;font-size:12px;min-height:44px;margin-top:12px}.footer{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:12px 3px 0}.toast{position:fixed;left:50%;top:20px;transform:translate(-50%,-20px);opacity:0;transition:.2s;background:#203852;border:1px solid #54708c;padding:10px 16px;border-radius:10px;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:760px){.app{padding:14px}.top{align-items:flex-start;gap:14px;flex-direction:column}.stats{width:100%}.stat{flex:1;min-width:0}.layout{grid-template-columns:1fr}.side{order:2}.tower-row{display:grid;grid-template-columns:1fr 1fr;gap:5px}.tower{margin:0;padding:9px 7px}.brand{font-size:20px}.footer{flex-direction:column;gap:4px}}
</style></head>
<body><main class="app"><header class="top"><div><div class="brand">✦ 星际<span>守望</span></div><div class="subtitle">守住跃迁核心，别让任何一只怪物穿过去。</div></div><div class="stats"><div class="stat"><small>能量晶体</small><b id="gold">180</b></div><div class="stat"><small>核心耐久</small><b id="life">20</b></div><div class="stat"><small>当前波次</small><b id="wave">0</b></div></div></header>
<div class="layout"><section class="board"><canvas id="game" width="900" height="570" aria-label="塔防游戏地图"></canvas><div class="overlay" id="overlay"><div class="banner"><strong>星际边境 · 守卫行动</strong><span>先建造防御塔，再启动第一波敌人</span></div></div></section><aside class="side"><h2>防御设施</h2><div class="tower-row"><button class="tower" data-type="pulse"><span class="icon">🔹</span><span><b>脉冲炮台</b><small>造价 60 · 均衡</small></span></button><button class="tower" data-type="frost"><span class="icon">❄️</span><span><b>寒霜炮台</b><small>造价 85 · 减速</small></span></button></div><div class="selection" id="selection">选择炮台后，在地图空地点击建造。</div><div class="actions"><button class="action" id="start">▶ 启动敌军波次</button><button class="action secondary" id="upgrade" disabled>⬆ 升级所选炮台</button><button class="action danger" id="sell" disabled>出售所选炮台（+30）</button></div><p class="help">操作提示<br>① 选择炮台，再点地图空地建造<br>② 点击已建炮台可选中并升级<br>③ 消灭敌人获得晶体；每波敌人更强<br>④ 敌人抵达出口会损失核心耐久</p></aside></div><div class="footer"><span>每次升级都会提升射程与伤害</span><span>自动保存关闭 · 刷新即可重新开始</span></div></main><div class="toast" id="toast"></div>
<script>
(()=>{const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),goldEl=document.querySelector('#gold'),lifeEl=document.querySelector('#life'),waveEl=document.querySelector('#wave'),overlay=document.querySelector('#overlay'),selection=document.querySelector('#selection'),startBtn=document.querySelector('#start'),upgradeBtn=document.querySelector('#upgrade'),sellBtn=document.querySelector('#sell'),toastEl=document.querySelector('#toast');
const path=[[-30,270],[105,270],[105,105],[300,105],[300,430],[515,430],[515,185],[720,185],[720,350],[930,350]],spots=[];const towers=[],enemies=[],shots=[];let gold=180,life=20,wave=0,spawnLeft=0,spawnTimer=0,selectedType=null,selectedTower=null,running=false,gameOver=false,last=0,toastTimer=0;
const specs={pulse:{cost:60,range:128,damage:24,rate:.72,color:'#69dbff',label:'脉冲炮台'},frost:{cost:85,range:145,damage:10,rate:.9,color:'#a7a6ff',label:'寒霜炮台'}};
function grid(){spots.length=0;for(let x=52;x<850;x+=52)for(let y=50;y<530;y+=48){if(!onPath(x,y,37))spots.push([x,y])}}function onPath(x,y,pad){for(let i=0;i<path.length-1;i++){let [ax,ay]=path[i],[bx,by]=path[i+1];let d=Math.hypot(bx-ax,by-ay),t=Math.max(0,Math.min(1,((x-ax)*(bx-ax)+(y-ay)*(by-ay))/(d*d)));if(Math.hypot(x-(ax+t*(bx-ax)),y-(ay+t*(by-ay)))<pad)return true}return false}
function notify(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1500)}function updateUI(){goldEl.textContent=gold;lifeEl.textContent=life;waveEl.textContent=wave;upgradeBtn.disabled=!selectedTower||gold<selectedTower.level*55;sellBtn.disabled=!selectedTower;startBtn.disabled=running||gameOver;startBtn.textContent=gameOver?'⟳ 重新开始':running?'敌军正在进攻…':'▶ 启动敌军波次';if(selectedTower){selection.textContent=`${specs[selectedTower.type].label} · Lv.${selectedTower.level} · 伤害 ${Math.round(specs[selectedTower.type].damage*(1+(selectedTower.level-1)*.55))} · 升级 ${selectedTower.level*55} 晶体`}else if(selectedType)selection.textContent=`已选择${specs[selectedType].label}，点击地图空地建造。`;else selection.textContent='选择炮台后，在地图空地点击建造。'}
function pointAt(distance){let d=distance;for(let i=0;i<path.length-1;i++){const [a,b]=[path[i],path[i+1]],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=len)return[a[0]+(b[0]-a[0])*d/len,a[1]+(b[1]-a[1])*d/len];d-=len}return path[path.length-1]}
function addEnemy(){const hp=(48+wave*14)*(wave%5===0?1.45:1),speed=45+Math.min(wave*1.7,24);enemies.push({dist:0,hp,max:hp,speed,r:wave%5===0?16:12,slow:0,reward:12+Math.floor(wave/3),boss:wave%5===0})}
function beginWave(){if(gameOver){gold=180;life=20;wave=0;enemies.length=0;towers.length=0;shots.length=0;gameOver=false;selectedTower=null;selectedType=null;overlay.style.display='flex';overlay.querySelector('strong').textContent='星际边境 · 守卫行动';overlay.querySelector('span').textContent='先建造防御塔，再启动第一波敌人'}grid()}if(running)return;wave++;spawnLeft=7+wave*2;spawnTimer=0;running=true;overlay.style.display='none';updateUI()}
document.querySelectorAll('.tower').forEach(b=>b.addEventListener('click',()=>{selectedType=b.dataset.type;selectedTower=null;document.querySelectorAll('.tower').forEach(x=>x.classList.toggle('active',x===b));updateUI()}));startBtn.addEventListener('click',beginWave);upgradeBtn.addEventListener('click',()=>{if(!selectedTower)return;const cost=selectedTower.level*55;if(gold<cost)return notify('晶体不足');gold-=cost;selectedTower.level++;updateUI()});sellBtn.addEventListener('click',()=>{if(!selectedTower)return;gold+=30+selectedTower.level*15;towers.splice(towers.indexOf(selectedTower),1);selectedTower=null;updateUI()});
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;const found=towers.find(t=>Math.hypot(t.x-x,t.y-y)<21);if(found){selectedTower=found;selectedType=null;document.querySelectorAll('.tower').forEach(b=>b.classList.remove('active'));updateUI();return}if(selectedType){const sp=specs[selectedType];if(gold<sp.cost)return notify('晶体不足');if(onPath(x,y,40)||towers.some(t=>Math.hypot(t.x-x,t.y-y)<34))return notify('这里不能建造');gold-=sp.cost;towers.push({x,y,type:selectedType,level:1,cool:0});selectedTower=towers[towers.length-1];selectedType=null;document.querySelectorAll('.tower').forEach(b=>b.classList.remove('active'));updateUI()}else{selectedTower=null;updateUI()}});
function draw(){const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#12243a';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#1c324a';ctx.lineWidth=1;for(let x=0;x<w;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#2d4557';ctx.lineWidth=76;ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.strokeStyle='#485e65';ctx.lineWidth=66;ctx.setLineDash([3,16]);ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#87eed0';ctx.font='bold 12px sans-serif';ctx.fillText('入口',15,245);ctx.fillStyle='#ffc66d';ctx.fillText('核心出口',830,329);
for(const [x,y] of spots){if(selectedType&&!onPath(x,y,42)){ctx.fillStyle='#71f0c115';ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}}
for(const t of towers){const sp=specs[t.type];if(selectedTower===t){ctx.fillStyle=sp.color+'18';ctx.beginPath();ctx.arc(t.x,t.y,sp.range,0,Math.PI*2);ctx.fill();ctx.strokeStyle=sp.color+'77';ctx.lineWidth=1;ctx.stroke()}ctx.fillStyle='#0b1524';ctx.beginPath();ctx.arc(t.x,t.y,20,0,Math.PI*2);ctx.fill();ctx.strokeStyle=selectedTower===t?'#fff':sp.color;ctx.lineWidth=3;ctx.stroke();ctx.fillStyle=sp.color;ctx.beginPath();ctx.arc(t.x,t.y,10+t.level,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eaf5ff';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText(t.level,t.x,t.y+3);ctx.textAlign='left'}
for(const e of enemies){const[x,y]=pointAt(e.dist);ctx.fillStyle=e.boss?'#ffb064':'#ff718c';ctx.beginPath();ctx.arc(x,y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-4,y-2,2,0,Math.PI*2);ctx.arc(x+4,y-2,2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#38283a';ctx.fillRect(x-16,y-e.r-9,32,4);ctx.fillStyle='#ff6b87';ctx.fillRect(x-16,y-e.r-9,32*Math.max(0,e.hp/e.max),4)}for(const s of shots){ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,5,0,Math.PI*2);ctx.fill()}}
function update(dt){if(running){spawnTimer-=dt;if(spawnLeft>0&&spawnTimer<=0){addEnemy();spawnLeft--;spawnTimer=Math.max(.42,1.05-wave*.025)}if(spawnLeft===0&&enemies.length===0){running=false;gold+=25+wave*3;notify(`第 ${wave} 波守住了！奖励晶体已到账`);updateUI()}}
for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.dist+=(e.slow>0?e.speed*.52:e.speed)*dt;e.slow=Math.max(0,e.slow-dt);if(e.dist>=path.slice(1).reduce((sum,p,j)=>sum+Math.hypot(p[0]-path[j][0],p[1]-path[j][1]),0)){enemies.splice(i,1);life--;if(life<=0){life=0;gameOver=true;running=false;overlay.style.display='flex';overlay.querySelector('strong').textContent='核心失守';overlay.querySelector('span').textContent=`你守到了第 ${wave} 波 · 点击“重新开始”再战`;notify('核心耐久耗尽');}updateUI()}}
for(const t of towers){t.cool-=dt;if(t.cool>0)continue;const sp=specs[t.type],range=sp.range+(t.level-1)*12;let target=null,best=-1;for(const e of enemies){const[x,y]=pointAt(e.dist),d=Math.hypot(x-t.x,y-t.y);if(d<range&&e.dist>best){target=e;best=e.dist}}if(target){const[x,y]=pointAt(target.dist);shots.push({x:t.x,y:t.y,tx:x,ty:y,target,speed:420,color:sp.color,damage:sp.damage*(1+(t.level-1)*.55),type:t.type});t.cool=sp.rate*Math.max(.56,1-(t.level-1)*.08)}}
for(let i=shots.length-1;i>=0;i--){const s=shots[i];if(!enemies.includes(s.target)){shots.splice(i,1);continue}const[x,y]=pointAt(s.target.dist),dx=x-s.x,dy=y-s.y,d=Math.hypot(dx,dy),step=s.speed*dt;if(d<=step){s.target.hp-=s.damage;if(s.type==='frost')s.target.slow=1.7;if(s.target.hp<=0){gold+=s.target.reward;enemies.splice(enemies.indexOf(s.target),1);updateUI()}shots.splice(i,1)}else{s.x+=dx/d*step;s.y+=dy/d*step}}
}
function frame(now){if(!last)last=now;const dt=Math.min(.04,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}grid();updateUI();requestAnimationFrame(frame)})();
</script></body></html>
